<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        h2 {
            color: black;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }
        
        li {
            margin: 5px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>list all properties</h2>
    <ul id="properties-list"></ul>
    
    <h2>after deleting the age</h2>
    <pre id="object-output"></pre>
</div>

<script>
    // 原始物件資料
    var Person = {
        firstName : "Tony",
        lastName : "Lee",
        age : 50,
        eyeColor : "Blue"
    };

    // 1. 列出所有屬性 (Keys)
    var properties = Object.keys(Person);
    var listElement = document.getElementById("properties-list");
    
    properties.forEach(function(prop) {
        var li = document.createElement("li");
        li.textContent = prop;
        listElement.appendChild(li);
    });

    // 2. 刪除 age 屬性
    delete Person.age;

    // 3. 渲染刪除後的物件到網頁上
    // JSON.stringify(..., null, 2) 可以將物件美化排版輸出
    document.getElementById("object-output").textContent = JSON.stringify(Person, null, 2);
</script>

</body>
</html>
